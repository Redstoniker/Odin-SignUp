<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien-Sign-Up</title>
</head>
<body>
    <div id="image">
    </div>
    <div id="content">
        <header>
        </header>
        <form action="" method="get">
            <header>
                <h1>Sign Up on Earth</h1>
            </header>
            <main>
                <div id="fname" class="input">
                    <label for="fname">FIRST NAME</label>
                    <input placeholder="Bob" type="text" name="fname" id="fname">
                </div>
                <div id="lname" class="input">
                    <label for="lname">LAST NAME</label>
                    <input placeholder="Meyer" type="text" name="lname" id="lname">
                </div>
                <div id="home-planet" class="input"> 
                    <label for="home-planet">HOME PLANET</label>
                    <input placeholder="Earth" type="text" name="home-planet" id="home-planet">
                </div>
                <div id="expected-age" class="input"> 
                    <label for="expected-age">AVERAGE AGE OF DEATH</label>
                    <input placeholder="100" type="number" min="5" max="1000" step="5" name="expected-age" id="expected-age">
                </div>
                <div id="spaceship-id" class="input"> 
                    <label for="spaceship-id">SPACESHIP ID</label>
                    <input type="password" name="spaceship-id" id="spaceship-id">
                </div>
                <div id="conf-spaceship-id" class="input"> 
                    <label for="conf-spaceship-id">CONFIRM SPACESHIP ID</label>
                    <input type="password" name="conf-spaceship-id" id="conf-spaceship-id">
                </div>
            </main>
            <footer>
                <button>Create Account</button>
                <p>
                    Already have an account?
                    <a href="">Log in</a>
                </p>
            </footer>
        </form>
    </div>
</body>
</html>
