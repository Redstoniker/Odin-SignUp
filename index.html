<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien-Sign-Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="leftside">
    </div>
    <div id="content">
        <summary>
            <p>
                This is not a real online service! Aliens are not on earth or anyhere where they could see this Website!
                But if you are one, feel free to become a legal member of earth on this website.
                Sign up <em>now</em> to get started.            
            </p>
            <p class="second">You <em>know</em> you want to.</p>
        </summary>
        <form action="" method="get">
            <main>
                <h1>Sign Up on Earth</h1>
                <div id="fname" class="input">
                    <label for="fname">FIRST NAME <p>*</p></label>
                    <input required placeholder="Bob" type="text" name="fname" id="fname">
                </div>
                <div id="lname" class="input">
                    <label for="lname">LAST NAME <p>*</p></label>
                    <input required placeholder="Meyer" type="text" name="lname" id="lname">
                </div>
                <div id="home-planet" class="input"> 
                    <label for="home-planet">HOME PLANET <p>*</p></label>
                    <input required placeholder="Earth" type="text" name="home-planet" id="home-planet">
                </div>
                <div id="expected-age" class="input"> 
                    <label for="expected-age">AVERAGE AGE OF DEATH</label>
                    <input placeholder="100" type="number" min="5" max="1000" step="1" name="expected-age" id="expected-age">
                </div>
                <div id="spaceship-id" class="input"> 
                    <label for="spaceship-id">SPACESHIP ID <p>*</p></label>
                    <input required type="password" name="spaceship-id" id="spaceship-id">
                </div>
                <div id="conf-spaceship-id" class="input"> 
                    <label for="conf-spaceship-id">CONFIRM SPACESHIP ID <p>*</p></label>
                    <input required type="password" name="conf-spaceship-id" id="conf-spaceship-id">
                </div>
            </main>
            <footer>
                <button>Create Account</button>
                
            </footer>
        </form>
        <footer>
            <p>
                    Already have an account?
                    <a href="">Log in</a>
                </p>
        </footer>
    </div>
</body>
</html>
